<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <title>Mi lista de tareas</title>
</head>

<body>
  <h1>Lista de tareas</h1>

  <!-- Aquí el usuario escribirá la tarea -->
  <div class="row mb-3">
    <input class="col-3" type="text" id="nuevaTarea" placeholder="Escribe una tarea" required />
    <button class="btn btn-success col-1" id="btnAgregar">Agregar</button>
  </div>


  <!-- Aquí aparecerán las tareas que se agreguen -->
  <ul id="listaTareas">
    
  </ul>

  <!-- Cargamos el JavaScript que hará funcionar todo -->
  <script src="script.js"></script>
</body>

</html>
